name: release

# Releases whatever version dylib/version.h names, once: a push to main whose version already
# has a tag publishes nothing. Work happens on branches; merging a PR that bumps the version
# releases it. Release notes are the CHANGELOG.md entries since the last release, and a sync PR's
# description (scripts/sync/release-notes.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time: two merges minutes apart both read the same untagged version, and the
# second must see the first one's tag, not race it for the same release
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    name: decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and look for its tag
        id: read
        run: |
          version=$(sed -n 's/^#define NOTPROTON_VERSION "\(.*\)"/\1/p' dylib/version.h)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/app.yml

  release:
    name: publish release
    needs: [version, build]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes compare CHANGELOG.md with the last release's tag
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Proton-ish
          path: release

      - name: Verify the archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ditto -x -k release/Proton-ish.zip release/extracted
          codesign --verify --strict release/extracted/Proton-ish.app
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' release/extracted/Proton-ish.app/Contents/Info.plist)
          test "$actual" = "$VERSION"
          make -s mincheck APP_BUNDLE=release/extracted/Proton-ish.app

      - name: Collect the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: sh scripts/sync/release-notes.sh "$GITHUB_SHA" > release/notes.md

      - name: Resolve Sparkle tools
        run: swift package resolve --package-path app

      - name: Generate the appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Sparkle shows the notes as HTML, rendered from the Markdown the way GitHub renders it
          gh api markdown -f text="$(cat release/notes.md)" -f mode=gfm -f context="$GITHUB_REPOSITORY" > release/Proton-ish.html
          printf '%s' "$SPARKLE_PRIVATE_KEY" | app/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --embed-release-notes \
            release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "v$VERSION" -m "Public release/$VERSION"
          git push --force origin "v$VERSION"
          gh release delete "v$VERSION" --yes || true
          # A version with a suffix (0.1.0-beta.1) is a pre-release
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" \
            release/Proton-ish.zip \
            release/appcast.xml \
            --title "$VERSION" \
            --notes-file release/notes.md \
            ${prerelease:+"$prerelease"}
          # The app reads its feed from this fixed release, because releases/latest skips pre-releases
          gh release view update-feed > /dev/null 2>&1 || gh release create update-feed \
            --title "Update feed" --notes "Sparkle feed read by Proton-ish. Not a release; download builds from the releases above." \
            --prerelease --latest=false
          gh release upload update-feed release/appcast.xml --clobber

      # Needs TAP_TOKEN: a fine-grained token with Contents write access to MagnusPladsen/homebrew-tap
      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN is not set, leaving the Homebrew cask alone"
            exit 0
          fi
          sha=$(shasum -a 256 release/Proton-ish.zip | cut -d' ' -f1)
          git clone -q --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/MagnusPladsen/homebrew-tap.git" tap
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" tap/Casks/proton-ish.rb
          if git -C tap diff --quiet; then
            echo "The cask already offers $VERSION"
            exit 0
          fi
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap commit -q -am "Update proton-ish to $VERSION"
          git -C tap push -q
