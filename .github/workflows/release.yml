name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
        type: string
      release_notes:
        description: Release notes
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/app.yml

  release:
    name: publish release
    needs: build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Proton-ish
          path: release

      - name: Verify the archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ditto -x -k release/Proton-ish.zip release/extracted
          codesign --verify --strict release/extracted/Proton-ish.app
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' release/extracted/Proton-ish.app/Contents/Info.plist)
          test "$actual" = "$VERSION"
          make -s mincheck APP_BUNDLE=release/extracted/Proton-ish.app

      - name: Resolve Sparkle tools
        run: swift package resolve --package-path app

      - name: Generate the appcast
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release/Proton-ish.txt
          printf '%s' "$SPARKLE_PRIVATE_KEY" | app/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --embed-release-notes \
            release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "v$VERSION" -m "Public release/$VERSION"
          git push --force origin "v$VERSION"
          gh release delete "v$VERSION" --yes || true
          # A version with a suffix (0.1.0-beta.1) is a pre-release
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" \
            release/Proton-ish.zip \
            release/appcast.xml \
            --title "$VERSION" \
            --notes "$RELEASE_NOTES" \
            ${prerelease:+"$prerelease"}
