# Keeps Proton-ish current with its upstreams: NotProton merges, Highball pin and database bumps
# as pull requests that bump the version and merge themselves once CI passes, which publishes a
# release; conflicting merges become issues for a person. A new Highball Wine build becomes a PR
# for review when its ntdll patches like a pinned build's, otherwise an issue.
name: upstream sync

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notproton:
    name: Merge NotProton
    runs-on: ubuntu-latest
    steps:
      - name: Need the sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::notice::SYNC_TOKEN is not set; see docs/development.md, Maintenance"
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.skip != '1'
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Merge NotProton's main
        if: env.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: sh scripts/sync/notproton.sh

  highball:
    name: Highball
    runs-on: xcode-27
    steps:
      - name: Need the sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::notice::SYNC_TOKEN is not set; see docs/development.md, Maintenance"
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.skip != '1'
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Select Xcode
        if: env.skip != '1'
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Bump HighballKit and the highball-db snapshot
        if: env.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: sh scripts/sync/highball.sh

  engines:
    name: Highball engines
    runs-on: ubuntu-latest
    steps:
      - name: Need the sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::notice::SYNC_TOKEN is not set; see docs/development.md, Maintenance"
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.skip != '1'
        with:
          token: ${{ secrets.SYNC_TOKEN }}
      # resolve.py disassembles ntdll with capstone. python3 -I skips the user site, so it goes
      # in a virtual environment put first on PATH
      - name: Install capstone
        if: env.skip != '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python3" -m pip install --quiet capstone==5.0.9
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Turn a new Wine build into a PR or an issue
        if: env.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: sh scripts/sync/highball-engine.sh
